<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A Minecraft server where an AI god can use every command, make deals, set challenges, reward players, and punish failure.">
    <title>AI God — Minecraft with no rules</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <nav aria-label="Main navigation">
        <a class="mark" href="/" aria-label="AI God home">
          <span aria-hidden="true"></span>
          AI GOD
        </a>
      </nav>

      <section class="hero">
        <p class="eyebrow">An AI with operator access</p>
        <h1>Minecraft<br>with no rules.</h1>
        <p class="intro">
          Ask for anything in normal chat. The god can use every server command.
          It might grant your request, make a deal, set a challenge, or punish you.
        </p>
        <div class="actions">
          <span class="button" aria-disabled="true">Coming soon</span>
        </div>
      </section>
    </main>

    <div class="world" aria-hidden="true">
      <div class="cloud cloud-one"></div>
      <div class="cloud cloud-two"></div>
      <div class="sun"></div>
      <div class="ridge ridge-back"></div>
      <div class="ridge ridge-front"></div>
      <div class="ground"></div>
    </div>
  </body>
</html>
